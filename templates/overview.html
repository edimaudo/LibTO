<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <title>libTO | Overview</title>
    <style>
        body { text-align: center; font-family: sans-serif; }
        
        .header-section { margin: 60px 0; }
        .header-section h1 { font-size: 3rem; color: #007FA3; }

        /* KPI Cards in one line */
        .kpi-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto 80px auto;
        }

        .kpi-card {
            flex: 1;
            padding: 20px;
            border: 1px solid #ddd;
            border-top: 4px solid #E31837;
            background: #fcfcfc;
        }

        /* Spacing and Centralization for Charts */
        .section-title { margin-top: 100px; font-size: 2rem; }
        
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            max-width: 1200px;
            margin: 40px auto;
        }

        .chart-container { height: 450px; width: 100%; border: 1px solid #eee; }
        
        #heatmap-viz { 
            height: 600px; 
            max-width: 1200px; 
            margin: 40px auto 100px auto; 
            border: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="header-section">
    <h1>libTO Overview</h1>
    </div>

<div class="kpi-row">
    <div class="kpi-card"><h3>Total Libraries</h3><p>{{ kpis.count }}</p></div>
    <div class="kpi-card"><h3>Avg Sq Ft</h3><p>{{ kpis.avg_sq_ft }}</p></div>
    <div class="kpi-card"><h3>Avg Workstations</h3><p>{{ kpis.avg_ws }}</p></div>
    <div class="kpi-card"><h3>Oldest Branch</h3><p>{{ kpis.oldest }}</p></div>
</div>

<h2 class="section-title">System Trends</h2>
<div class="charts-grid">
    <div id="reg"></div>
    <div id="circ"></div>
    <div id="visits"></div>
    <div id="ws"></div>
</div>

<h2 class="section-title">Square Footage Heatmap</h2>
<div id="heatmap-viz"></div>

<script>
    // Explicitly parsing the JSON and targeting IDs
    const config = {responsive: true};
    Plotly.newPlot('reg', {{ charts.reg | safe }}, config);
    Plotly.newPlot('circ', {{ charts.circ | safe }}, config);
    Plotly.newPlot('visits', {{ charts.visits | safe }}, config);
    Plotly.newPlot('ws', {{ charts.ws | safe }}, config);
    Plotly.newPlot('heatmap-viz', {{ heatmap | safe }}, config);
</script>

</body>
</html>
