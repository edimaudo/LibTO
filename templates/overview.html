<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <title>libTO | Overview</title>
    <style>
        /* Specific overrides for this page */
        .overview-header {
            text-align: center;
            padding: 60px 0 20px;
        }

        .overview-header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin: 0;
        }

        /* 4 Pillars in one line */
        .pillars-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin: 80px 0 40px;
            font-size: 2rem;
            font-weight: 700;
            clear: both;
        }

        /* Grid for 2x2 charts */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            max-width: 1400px;
            margin: 0 auto 60px;
            padding: 0 20px;
        }

        .chart-box {
            min-height: 450px;
            background: #ffffff;
            border: 1px solid #eee;
            padding: 10px;
        }

        .heatmap-container {
            max-width: 1400px;
            margin: 0 auto 100px;
            padding: 0 20px;
        }

        #heatmap-viz {
            height: 600px;
            width: 100%;
            border: 1px solid #eee;
        }


    </style>
</head>
<body class="light-theme">

<header class="overview-header">
    <h1>libTO Overview</h1>
</header>

<main>
    <section class="pillars-row">
        <div class="pillar-card">
            
            <h2 style="text-align: center;">Total Libraries</h2>
            <p class="kpi-value" style="text-align: center; font-size: 2rem; font-weight: bold; color: var(--tpl-accent-blue);">{{ kpis.count }}</p>
        </div>
        <div class="pillar-card">
            
            <h2 style="text-align: center;">Avg. Sq. Footage</h2>
            <p class="kpi-value" style="text-align: center; font-size: 2rem; font-weight: bold; color: var(--tpl-accent-blue);">{{ kpis.avg_sq_ft }}</p>
        </div>
        <div class="pillar-card">
            
            <h2 style="text-align: center;">Avg. Workstations</h2>
            <p class="kpi-value" style="text-align: center; font-size: 2rem; font-weight: bold; color: var(--tpl-accent-blue);">{{ kpis.avg_ws }}</p>
        </div>
        <div class="pillar-card">
            
            <h2 style="text-align: center;">Oldest Branch</h2>
            <p class="kpi-value" style="text-align: center; font-size: 1.2rem; font-weight: bold; color: var(--tpl-accent-blue);">{{ kpis.oldest }}</p>
        </div>
    </section>

<h2>System Trends</h2>
    <div class="charts-grid">
        <div id="reg" class="chart-box"></div>
        <div id="circ" class="chart-box"></div>
        <div id="visits" class="chart-box"></div>
        <div id="ws" class="chart-box"></div>
    </div>

    <h2>Square Footage Heatmap</h2>
    <div id="heatmap-viz"></div>

    <script>
        const config = { responsive: true };

        // Helper to safely parse and plot
        function renderPlot(id, jsonData) {
            try {
                const parsedData = JSON.parse(jsonData);
                Plotly.newPlot(id, parsedData.data, parsedData.layout, config);
            } catch (e) {
                console.error("Error rendering " + id, e);
            }
        }

        renderPlot('reg', '{{ charts.reg | safe }}');
        renderPlot('circ', '{{ charts.circ | safe }}');
        renderPlot('visits', '{{ charts.visits | safe }}');
        renderPlot('ws', '{{ charts.ws | safe }}');
        renderPlot('heatmap-viz', '{{ heatmap | safe }}');
    </script>

</body>
</html>
