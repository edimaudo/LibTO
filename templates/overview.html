<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <title>libTO | Overview</title>
    <style>
        body { text-align: center; background-color: #ffffff; color: #333; }
        
        .overview-header h1 {
            margin: 50px 0;
            font-size: 2.5rem;
            color: var(--tpl-blue);
        }

        /* 4 Pillars - Forced into one line */
        .pillars-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 60px;
            padding: 0 20px;
        }

        .pillar-card {
            flex: 1;
            min-width: 200px;
            max-width: 300px;
            padding: 20px;
            border: 1px solid #ddd;
            border-top: 5px solid var(--tpl-blue);
            background: #f9f9f9;
        }

        /* Spacing for sections */
        .section-container {
            margin-top: 100px; /* Large spacing to see text clearly */
            padding: 0 50px;
        }

        /* 2x2 Grid for Trends */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
        }

        .chart-box {
            height: 450px; /* Required for Plotly to render */
            border: 1px solid #eee;
        }

        #heatmap-viz {
            height: 600px;
            margin-top: 40px;
            border: 1px solid #eee;
        }
    </style>
</head>
<body>

<header class="overview-header">
    <h1>libTO Overview</h1>
</header>

<main>
    <section class="pillars-row">
        <div class="pillar-card">
            <h3>Total Libraries</h3>
            <p class="kpi-value"><b>{{ kpis.count }}</b></p>
        </div>
        <div class="pillar-card">
            <h3>Avg Sq Footage</h3>
            <p class="kpi-value"><b>{{ kpis.avg_sq_ft }}</b></p>
        </div>
        <div class="pillar-card">
            <h3>Avg Workstations</h3>
            <p class="kpi-value"><b>{{ kpis.avg_ws }}</b></p>
        </div>
        <div class="pillar-card">
            <h3>Oldest Branch</h3>
            <p class="kpi-value"><b>{{ kpis.oldest }}</b></p>
        </div>
    </section>

    <div class="section-container">
        <h2>System Trends</h2>
        <div class="charts-grid">
            <div id="chart-reg" class="chart-box"></div>
            <div id="chart-circ" class="chart-box"></div>
            <div id="chart-visits" class="chart-box"></div>
            <div id="chart-ws" class="chart-box"></div>
        </div>
    </div>

    <div class="section-container" style="margin-bottom: 100px;">
        <h2>Square Footage Heatmap</h2>
        <div id="heatmap-viz"></div>
    </div>
</main>

<script>
    // Configuration to make charts responsive
    const config = { responsive: true };

    // The JSON.parse( ... | safe ) pattern is the most reliable way to load Plotly data
    try {
        const dataReg = JSON.parse('{{ charts.reg | safe }}');
        const dataCirc = JSON.parse('{{ charts.circ | safe }}');
        const dataVisits = JSON.parse('{{ charts.visits | safe }}');
        const dataWS = JSON.parse('{{ charts.ws | safe }}');
        const dataHeatmap = JSON.parse('{{ heatmap | safe }}');

        Plotly.newPlot('chart-reg', dataReg.data, dataReg.layout, config);
        Plotly.newPlot('chart-circ', dataCirc.data, dataCirc.layout, config);
        Plotly.newPlot('chart-visits', dataVisits.data, dataVisits.layout, config);
        Plotly.newPlot('chart-ws', dataWS.data, dataWS.layout, config);
        Plotly.newPlot('heatmap-viz', dataHeatmap.data, dataHeatmap.layout, config);
    } catch (err) {
        console.error("Plotly Rendering Error:", err);
    }
</script>

</body>
</html>
